name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Versions
        run: moon version --all

      - name: Update registry index
        run: moon update

      - name: Check (warnings are errors)
        run: moon check --deny-warn

      - name: Format check
        run: moon fmt --check

      - name: Interface files up to date
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: Test (all backends)
        run: moon test --target all

      - name: Run demo
        run: |
          moon run src/examples/demo
          moon run src/examples/s1_cn_distance
          moon run src/examples/s2_utm_mgrs
          moon run src/examples/s3_accuracy
          moon run src/examples/s4_polygon_area

      - name: Run CLI example
        run: |
          moon run src/examples/cli -- geod inverse 39.9087 116.3975 31.2304 121.4737
          moon run src/examples/cli -- geod direct 22.5431 114.0579 90 1000000
          moon run src/examples/cli -- coord wgs2gcj 39.9087 116.3975
          moon run src/examples/cli -- coord gcj2wgs 39.91010 116.40374
          moon run src/examples/cli -- coord gcj2bd 39.91010 116.40374
          moon run src/examples/cli -- coord bd2gcj 39.91645 116.41012
          moon run src/examples/cli -- coord wgs2bd 39.9087 116.3975
          moon run src/examples/cli -- coord bd2wgs 39.91645 116.41012
          if moon run src/examples/cli -- nope; then
            echo "unknown command should fail"
            exit 1
          fi

      - name: Package
        run: moon package --list
